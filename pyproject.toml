[project]
name = "butler"
version = "0.1.0"
description = "Personal automation agent: runs on this machine, takes requests from your phone over Tailscale."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "playwright>=1.62",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["butler"]
